<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Forever Jukebox</title>
    <style>
      html.app-loading body {
        opacity: 0;
      }
      html.app-loading #app {
        visibility: hidden;
      }
    </style>
    <script>
      document.documentElement.classList.add("app-loading");
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Tilt+Neon&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..700,0..1,-50..200"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <section class="panel tab-panel hidden" data-tab-panel="play">
        <div class="panel" id="play-status">
          <div class="status-row">
            <div
              class="spinner hidden"
              id="analysis-spinner"
              aria-hidden="true"
            ></div>
            <div class="status-progress" id="analysis-progress"></div>
            <div class="status-text" id="analysis-status">
              No track selected.
            </div>
            <button id="saved-playlist" class="saved-playlist-button hidden" type="button">
              Saved Playlist
            </button>
          </div>
        </div>
        <div id="play-menu-root"></div>
        <div id="viz-panel" class="hidden">
            <div id="jukebox-viz" class="viz">
              <div id="branch-stats-popup" class="branch-stats-popup hidden">
                <div class="branch-stats-popup-header">
                  <div class="branch-stats-popup-title" id="branch-stats-title">Branch stats</div>
                  <button
                    id="branch-stats-delete"
                    class="branch-stats-delete"
                    aria-label="Delete selected branch"
                    title="Delete selected branch"
                  >
                    <span
                      class="material-symbols-outlined branch-stats-delete-icon"
                      aria-hidden="true"
                      >delete</span
                    >
                  </button>
                </div>
                <div class="branch-stats-popup-row">
                  <span class="branch-stats-popup-label">Direction:</span>
                  <span class="branch-stats-popup-value" id="branch-stats-direction">Backward</span>
                </div>
                <div class="branch-stats-popup-row">
                  <span class="branch-stats-popup-label">Start:</span>
                  <span class="branch-stats-popup-value" id="branch-stats-start">00:00:00</span>
                </div>
                <div class="branch-stats-popup-row">
                  <span class="branch-stats-popup-label">End:</span>
                  <span class="branch-stats-popup-value" id="branch-stats-end">00:00:00</span>
                </div>
                <div class="branch-stats-popup-row">
                  <span class="branch-stats-popup-label">Difference:</span>
                  <span class="branch-stats-popup-value" id="branch-stats-delta">+00:00:00</span>
                </div>
                <div class="branch-stats-popup-row">
                  <span class="branch-stats-popup-label">Branch Match:</span>
                  <span class="branch-stats-popup-value" id="branch-stats-similarity">0%</span>
                </div>
              </div>
              <div class="viz-top">
              <div class="viz-actions">
                <label class="viz-select-group" for="play-mode-select">
                  <span class="viz-select-wrap">
                    <select
                      id="play-mode-select"
                      class="viz-select"
                      aria-label="Mode"
                    >
                      <option value="autocanonizer">Autocanonizer</option>
                      <option value="jukebox" selected>Jukebox</option>
                    </select>
                    <span
                      class="material-symbols-outlined viz-select-arrow"
                      aria-hidden="true"
                      >arrow_drop_down</span
                    >
                  </span>
                </label>
              </div>
              <div class="viz-controls">
                <label class="viz-select-group" for="viz-select">
                  <span class="viz-select-wrap">
                    <select
                      id="viz-select"
                      class="viz-select"
                      aria-label="Visualization"
                    >
                      <option value="0">Arc</option>
                      <option value="1">Classic</option>
                      <option value="2">Galaxy</option>
                      <option value="3">Grid</option>
                      <option value="4">Infinite</option>
                      <option value="5">Wave</option>
                    </select>
                    <span
                      class="material-symbols-outlined viz-select-arrow"
                      aria-hidden="true"
                      >arrow_drop_down</span
                    >
                  </span>
                </label>
              </div>
              <div class="canonizer-finish">
                <input type="checkbox" id="canonizer-finish" />
                <span>Finish out the track</span>
              </div>
            </div>
            <div id="viz-layer" class="viz-layer"></div>
            <div id="canonizer-layer" class="canonizer-layer"></div>
            <div class="viz-bottom" id="viz-stats">
              <div class="viz-bottom-left">
                <div class="viz-play-controls">
                  <button
                    id="playlist-previous"
                    class="playlist-control is-hidden"
                    type="button"
                    aria-label="Previous playlist track"
                    title="Previous playlist track"
                  >
                    <span
                      class="material-symbols-outlined playlist-control-icon"
                      aria-hidden="true"
                      >skip_previous</span
                    >
                  </button>
                  <button
                    id="viz-play"
                    class="play-toggle viz-play-toggle"
                    aria-label="Play"
                  >
                    <span
                      class="material-symbols-outlined play-icon"
                      aria-hidden="true"
                      >play_arrow</span
                    >
                  </button>
                  <button
                    id="playlist-next"
                    class="playlist-control is-hidden"
                    type="button"
                    aria-label="Next playlist track"
                    title="Next playlist track"
                  >
                    <span
                      class="material-symbols-outlined playlist-control-icon"
                      aria-hidden="true"
                      >skip_next</span
                    >
                  </button>
                </div>
                <div class="viz-info">
                  <div class="viz-title" id="viz-now-playing">
                    The Forever Jukebox
                  </div>
                  <div class="viz-meta">
                    <span class="viz-meta-stats">
                      <span>Listen Time:</span>
                      <span id="listen-time">00:00:00</span>
                      <span id="viz-beats-divider" class="viz-divider">·</span>
                      <span id="viz-beats-label">Total Beats:</span>
                      <span id="beats-played">0</span>
                    </span>
                    <span
                      id="bring-home-fullscreen-label"
                      class="bring-home-fullscreen-note is-hidden"
                      >· Bringing it on home</span
                    >
                  </div>
                </div>
              </div>
              <div class="viz-bottom-right" id="viz-bottom-right-root"></div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
