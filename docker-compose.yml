services:
  forever-jukebox:
    platform: linux/amd64
    container_name: forever-jukebox
    image: forever-jukebox
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    volumes:
      - storage:/app/api/storage
    environment:
      SPOTIFY_CLIENT_ID: "${SPOTIFY_CLIENT_ID:-}"
      SPOTIFY_CLIENT_SECRET: "${SPOTIFY_CLIENT_SECRET:-}"
      YOUTUBE_API_KEY: "${YOUTUBE_API_KEY:-}"
      ADMIN_KEY: "${ADMIN_KEY:-}"
      NTFY_TOPIC_KEY: "${NTFY_TOPIC_KEY:-}"
      PORT: "${PORT:-8000}"
      WORKER_COUNT: "${WORKER_COUNT:-}"
      MAX_TRACK_LENGTH: "${MAX_TRACK_LENGTH:-}"
      ALLOW_USER_UPLOAD: "${ALLOW_USER_UPLOAD:-}"
      ALLOW_USER_YOUTUBE: "${ALLOW_USER_YOUTUBE:-}"
      ALLOW_FAVORITES_SYNC: "${ALLOW_FAVORITES_SYNC:-}"
    restart: unless-stopped

volumes:
  storage:
